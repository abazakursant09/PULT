# SECURITY-2D-3E1B-3B1 — PITR PostgreSQL settings (valid GUC only; mounted READ-ONLY).
# NO credentials here. NO `|| true`. `archive-async` is NOT a PostgreSQL GUC — it lives in
# pgbackrest.conf. Credentials for archive-push arrive via the postgres process environment
# (PGBACKREST_* from secret files), never in argv or in this file.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=pult archive-push %p'
archive_timeout = 60s
full_page_writes = on
max_wal_senders = 3
