name: Constitutional Verification

# Any failure in any step fails the pipeline. No exceptions.
on:
  push:
  pull_request:

jobs:
  constitution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ruff is pinned: unpinned, every run picked up whatever release existed that day,
          # so a new Ruff turned this job red on files no PR had touched (0.16.0 found 42
          # errors in the constitutional packages that 0.15.22 did not). 0.15.22 is the
          # version the last green master run (29861338041, commit 3068f3c) actually used.
          # Raising it is a deliberate decision, made in its own PR, never a surprise.
          pip install "ruff==0.15.22" pytest pytest-cov coverage

      - name: Ruff (constitutional packages)
        run: |
          ruff check \
            root_constitution \
            runtime_envelope \
            replay_chain \
            runtime_application \
            operational_review \
            constitutional_enforcement \
            tests/root_constitution \
            tests/constitutional_enforcement

      - name: Pytest (full suite)
        run: pytest -p no:cacheprovider -q

      - name: Constitutional gate (verify_full_constitution)
        run: python -m constitutional_enforcement.constitution_gate

  # PULT-LAUNCH-2.5E-1 — REAL PostgreSQL proof that the eco1a2b3c4d01 migration applies on top of the
  # full Alembic chain over NON-EMPTY observation tables (backfill, NOT NULL, no default) AND that the
  # change-only latest-of-series lookup uses ix_price_obs_series / ix_promo_obs_series (incl. the
  # unassigned product_id IS NULL case). No skip / xfail / create_all — with the pad1a2b3c4d01 PostgreSQL
  # fix on master the chain reaches eco, so any failure here is a real red.
  postgres-explain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pult_explain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary asyncpg pytest

      - name: Real Alembic migration + EXPLAIN index gate + retention DELETE (real PostgreSQL)
        env:
          PULT_TEST_PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pult_explain
          PULT_TEST_PG_ALEMBIC_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pult_explain
        run: |
          pytest -p no:cacheprovider -q -s -rA \
            tests/test_change_only_observations.py::test_pg_alembic_migration_nonempty_and_explain \
            tests/test_observation_retention_sweep.py::test_pg_functional_delete \
