name: Constitutional Verification

# Any failure in any step fails the pipeline. No exceptions.
on:
  push:
  pull_request:

jobs:
  constitution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ruff is pinned: unpinned, every run picked up whatever release existed that day,
          # so a new Ruff turned this job red on files no PR had touched (0.16.0 found 42
          # errors in the constitutional packages that 0.15.22 did not). 0.15.22 is the
          # version the last green master run (29861338041, commit 3068f3c) actually used.
          # Raising it is a deliberate decision, made in its own PR, never a surprise.
          pip install "ruff==0.15.22" pytest pytest-cov coverage

      - name: Ruff (constitutional packages)
        run: |
          ruff check \
            root_constitution \
            runtime_envelope \
            replay_chain \
            runtime_application \
            operational_review \
            constitutional_enforcement \
            tests/root_constitution \
            tests/constitutional_enforcement

      - name: Pytest (full suite)
        run: pytest -p no:cacheprovider -q

      - name: Constitutional gate (verify_full_constitution)
        run: python -m constitutional_enforcement.constitution_gate

  # PULT-LAUNCH-2.5E-1 — REAL PostgreSQL proof that the change-only latest-of-series lookup uses
  # ix_price_obs_series / ix_promo_obs_series (incl. the unassigned product_id IS NULL case). A SQLite
  # EXPLAIN is never accepted as a substitute; this job runs the query planner that production uses.
  postgres-explain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pult_explain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary pytest

      - name: EXPLAIN index gate (real PostgreSQL)
        env:
          PULT_TEST_PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pult_explain
        run: |
          pytest -p no:cacheprovider -q \
            tests/test_change_only_observations.py::test_explain_uses_series_index_or_blocked_environment \
            -o addopts="" -rs

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # A production build compiles the app; it does not run a single test. That gap is not
  # theoretical: a runaway render loop that exhausted the heap, and a race that left real network
  # requests outliving their tests, both reached master while frontend-build stayed green.
  #
  # Deliberately NOT tuned to pass. Default parallel mode, stock memory limit, no
  # continue-on-error: the suite must fail here for the same reasons it would fail locally,
  # including an OOM or an unhandled rejection. Independent of frontend-build — a broken build and
  # a broken test suite are separate facts, and each should be reported on its own.
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --no-install so a missing devDependency fails loudly instead of being fetched on the fly.
      - name: Run frontend tests
        run: npx --no-install vitest run
