name: Constitutional Verification

# Any failure in any step fails the pipeline. No exceptions.
on:
  push:
  pull_request:

jobs:
  constitution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ruff is pinned: unpinned, every run picked up whatever release existed that day,
          # so a new Ruff turned this job red on files no PR had touched (0.16.0 found 42
          # errors in the constitutional packages that 0.15.22 did not). 0.15.22 is the
          # version the last green master run (29861338041, commit 3068f3c) actually used.
          # Raising it is a deliberate decision, made in its own PR, never a surprise.
          pip install "ruff==0.15.22" pytest pytest-cov coverage

      - name: Ruff (constitutional packages)
        run: |
          ruff check \
            root_constitution \
            runtime_envelope \
            replay_chain \
            runtime_application \
            operational_review \
            constitutional_enforcement \
            tests/root_constitution \
            tests/constitutional_enforcement

      - name: Pytest (full suite)
        run: pytest -p no:cacheprovider -q

      - name: Constitutional gate (verify_full_constitution)
        run: python -m constitutional_enforcement.constitution_gate

  # PULT-LAUNCH-2.5E-1 — REAL PostgreSQL proof that the eco1a2b3c4d01 migration applies on top of the
  # full Alembic chain over NON-EMPTY observation tables (backfill, NOT NULL, no default) AND that the
  # change-only latest-of-series lookup uses ix_price_obs_series / ix_promo_obs_series (incl. the
  # unassigned product_id IS NULL case). No skip / xfail / create_all — with the pad1a2b3c4d01 PostgreSQL
  # fix on master the chain reaches eco, so any failure here is a real red.
  postgres-explain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pult_explain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary asyncpg pytest

      - name: Real Alembic migration + EXPLAIN index gate + retention DELETE (real PostgreSQL)
        env:
          PULT_TEST_PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pult_explain
          PULT_TEST_PG_ALEMBIC_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pult_explain
        run: |
          pytest -p no:cacheprovider -q -s -rA \
            tests/test_change_only_observations.py::test_pg_alembic_migration_nonempty_and_explain \
            tests/test_observation_retention_sweep.py::test_pg_functional_delete \
            tests/test_observation_retention_sweep.py::test_pg_second_advisory_lock_blocks \
            tests/test_observation_retention_sweep.py::test_pg_advisory_lock_released_after_error \
            tests/test_observation_retention_sweep.py::test_pg_parent_delete_cascades_children_real_fk \
            tests/test_observation_retention_sweep.py::test_pg_rollback_keeps_rows_then_next_run_continues \
            tests/test_observation_retention_sweep.py::test_pg_statement_timeout_rolls_back_batch \
            tests/test_observation_retention_sweep.py::test_pg_lock_timeout_rolls_back_batch \
            tests/test_observation_retention_sweep.py::test_pg_deadline_between_batches_timed_out \
            tests/test_observation_retention_sweep.py::test_pg_dry_run_counts_only \
            tests/test_token_version_pg.py::test_pg_concurrent_logout_no_lost_update \
            tests/test_token_version_pg.py::test_pg_old_jwt_rejected_after_bump_new_accepted \
            tests/test_token_version_pg.py::test_pg_reset_bump_revokes_old_session \
            tests/test_token_version_pg.py::test_pg_db_failure_is_503 \
            tests/test_auth_throttle_pg.py::test_pg_concurrent_failures_all_counted \
            tests/test_auth_throttle_pg.py::test_pg_block_boundary_is_exact \
            tests/test_auth_throttle_pg.py::test_pg_identity_caught_across_rotating_ips \
            tests/test_auth_throttle_pg.py::test_pg_ip_caught_across_rotating_emails \
            tests/test_auth_throttle_pg.py::test_pg_single_source_never_globally_locks_victim \
            tests/test_auth_throttle_pg.py::test_pg_distributed_attack_reaches_identity_global \
            tests/test_auth_throttle_pg.py::test_pg_cleanup_does_not_lose_a_concurrent_new_attempt \
            tests/test_auth_throttle_pg.py::test_pg_unknown_and_real_email_same_bucket \
            tests/test_auth_throttle_pg.py::test_pg_window_resets_after_elapse \
            tests/test_auth_throttle_pg.py::test_pg_blocked_until_is_monotonic \
            tests/test_auth_throttle_pg.py::test_pg_release_does_not_clear_block \
            tests/test_auth_throttle_pg.py::test_pg_state_persists_across_sessions \
            tests/test_auth_throttle_pg.py::test_pg_cleanup_keeps_active_block_deletes_expired \
            tests/test_mfa_replay_pg.py::test_pg_two_concurrent_verify_one_success \
            tests/test_mfa_replay_pg.py::test_pg_same_step_replay_rejected \
            tests/test_mfa_replay_pg.py::test_pg_prior_step_after_newer_rejected \
            tests/test_mfa_replay_pg.py::test_pg_next_step_accepted \
            tests/test_mfa_replay_pg.py::test_pg_rollback_before_commit_does_not_burn_step \
            tests/test_mfa_replay_pg.py::test_pg_uncommitted_claim_not_visible_to_others \
            tests/test_mfa_replay_pg.py::test_pg_db_error_is_503 \
            tests/test_mfa_replay_pg.py::test_pg_enable_concurrent_one_success \
            tests/test_mfa_replay_pg.py::test_pg_disable_replay_rejected \
            tests/test_reset_digest_pg.py::test_pg_concurrent_confirm_one_success \
            tests/test_reset_digest_pg.py::test_pg_success_bumps_token_version_and_password \
            tests/test_reset_digest_pg.py::test_pg_reuse_after_success_rejected \
            tests/test_reset_digest_pg.py::test_pg_rollback_keeps_token_valid \
            tests/test_reset_digest_pg.py::test_pg_expired_token_rejected \
            tests/test_reset_digest_pg.py::test_pg_expiry_comparison_works \
            tests/test_login_attempts_drop_pg.py::test_pg_drop_login_attempts_removes_table_and_pii \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_concurrent_counted_and_boundary \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_identity_across_ips \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_ip_across_users \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_single_source_never_locks_victim_but_distributed_does \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_success_release_keeps_block \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_persists_across_sessions \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_manage_boundary_and_victim_lockout \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_manage_identity_across_ips \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_manage_ip_across_users \
            tests/test_mfa_throttle_pg.py::test_pg_mfa_login_and_manage_are_isolated \
            tests/test_mfa_throttle_pg.py::test_pg_active_block_not_bypassed_by_a_correct_code \
            tests/test_mfa_throttle_pg.py::test_pg_reservation_option_c_semantics \
            tests/test_mfa_throttle_pg.py::test_pg_enable_bumps_token_version_and_reissues_cookie \
            tests/test_mfa_throttle_pg.py::test_pg_disable_bumps_token_version_and_reissues_cookie \
            tests/test_mfa_throttle_pg.py::test_pg_wrong_manage_code_does_not_bump_or_reissue \
            tests/test_mfa_throttle_pg.py::test_pg_concurrent_enable_no_desync \
            tests/test_mfa_throttle_pg.py::test_pg_enable_http_flow_sets_httponly_cookie_and_revokes_old \
            tests/test_mfa_throttle_pg.py::test_pg_disable_http_flow_sets_cookie_and_me_works \
            tests/test_mfa_throttle_pg.py::test_pg_manage_http_wrong_and_429_issue_no_cookie \
            tests/test_execlog_idempotency_foundation_pg.py::test_pg_additive_migration_preserves_rows

  # Proves the FULL Alembic chain runs on the database production actually uses. The chain was
  # historically only exercised on SQLite, which has no strict boolean type and silently accepted an
  # integer literal for a boolean column (pad1a2b3c4d01). This job runs a REAL upgrade base->head on a
  # clean PostgreSQL 16 and asserts a single head. No skip / xfail / create_all: any error is red.
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pult_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install asyncpg

      - name: Alembic upgrade base->head (real PostgreSQL)
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pult_migration
          APP_ENV: development
        run: python -m alembic upgrade head

      - name: Assert a single Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert len(heads) == 1, f"expected a single head, got {heads}"
          print("single head:", heads[0])
          PY

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # A production build compiles the app; it does not run a single test. That gap is not
  # theoretical: a runaway render loop that exhausted the heap, and a race that left real network
  # requests outliving their tests, both reached master while frontend-build stayed green.
  #
  # Deliberately NOT tuned to pass. Default parallel mode, stock memory limit, no
  # continue-on-error: the suite must fail here for the same reasons it would fail locally,
  # including an OOM or an unhandled rejection. Independent of frontend-build — a broken build and
  # a broken test suite are separate facts, and each should be reported on its own.
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --no-install so a missing devDependency fails loudly instead of being fetched on the fly.
      - name: Run frontend tests
        run: npx --no-install vitest run
