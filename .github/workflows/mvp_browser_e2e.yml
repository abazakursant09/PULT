name: MVP Browser E2E

# SQLite smoke plus PostgreSQL two-user, restore and session browser acceptance.
# No product credentials, real mail or external services.
# Runtime inputs are covered; documentation-only PRs do not spend browser minutes.
on:
  pull_request:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/mvp_browser_e2e.yml
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/mvp_browser_e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install locked backend dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements-ci.lock

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Use official Ubuntu package mirrors
        run: |
          set -euo pipefail
          # Hosted-runner Azure mirror DNS failed before any browser test ran.
          # Keep Ubuntu's signed repositories/keyrings, HTTPS and every test intact.
          getent ahosts archive.ubuntu.com >/dev/null
          getent ahosts security.ubuntu.com >/dev/null
          for list in /etc/apt/apt-mirrors.txt /etc/apt/apt-security-mirrors.txt; do
            test -f "$list"
            test ! -L "$list"
          done
          grep -Eq '^https?://(azure\.archive|archive)\.ubuntu\.com/ubuntu/?$' /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null

      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare disposable database
        run: |
          E2E_ROOT="$(mktemp -d "${RUNNER_TEMP%/}/pult-mvp-e2e.XXXXXXXX")"
          mkdir "$E2E_ROOT/data"
          echo "E2E_DB_PATH=$E2E_ROOT/data/e2e.sqlite" >> "$GITHUB_ENV"

      - name: Run MVP browser
        working-directory: frontend
        run: bash e2e/run-ci.sh

      - name: Prepare native PostgreSQL tools and disposable root
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          echo "PULT_E2E_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          PG_E2E_ROOT="$(mktemp -d "${RUNNER_TEMP%/}/pult-pg-e2e.XXXXXXXX")"
          echo "PULT_E2E_PG_ROOT=$PG_E2E_ROOT" >> "$GITHUB_ENV"

      - name: Run PostgreSQL browser, native restore and session acceptance
        working-directory: frontend
        env:
          PULT_E2E_SUITE: postgres
        run: bash e2e/run-ci.sh

# No upload-artifact: traces/DBs may contain synthetic auth tokens; keep them job-local.
