name: MVP Browser E2E

# One real register -> CSV -> recommendation flow. No product credentials or services.
# Runtime inputs are covered; documentation-only PRs do not spend browser minutes.
on:
  pull_request:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/mvp_browser_e2e.yml
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/mvp_browser_e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install locked backend dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements-ci.lock

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare disposable database
        run: |
          E2E_ROOT="$(mktemp -d "${RUNNER_TEMP%/}/pult-mvp-e2e.XXXXXXXX")"
          mkdir "$E2E_ROOT/data"
          echo "E2E_DB_PATH=$E2E_ROOT/data/e2e.sqlite" >> "$GITHUB_ENV"

      - name: Run MVP browser
        working-directory: frontend
        run: bash e2e/run-ci.sh

# No upload-artifact: traces/DBs may contain synthetic auth tokens; keep them job-local.
