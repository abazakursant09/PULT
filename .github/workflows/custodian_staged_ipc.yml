name: Custodian Staged IPC

# Dormant synthetic packet/stage proof only; no working credentials or deployment.
on:
  pull_request:
    paths:
      - ops/backup/**
      - ops/canary/canary.py
      - backend/tests/test_custodian_staged_ipc_ci.py
      - .github/workflows/custodian_staged_ipc.yml
      - .gitattributes
  push:
    branches: [master]
    paths:
      - ops/backup/**
      - ops/canary/canary.py
      - backend/tests/test_custodian_staged_ipc_ci.py
      - .github/workflows/custodian_staged_ipc.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r backend/requirements-ci.lock
      - name: Guard dormant staged IPC sources and workflow
        run: python -m pytest backend/tests/test_custodian_staged_ipc_ci.py -q
      - name: Download seven hash-pinned synthetic wheels
        run: |
          set -euo pipefail
          test -x /usr/bin/python3.12
          python -m pip download --only-binary=:all: --no-deps --require-hashes -r ops/backup/custodian/requirements.lock -d ops/backup/tests/custodian_v2/wheels
      - name: Native staged IPC and independent postcheck
        run: sudo -n -- unshare --net /usr/bin/python3.12 -I -S -B ops/backup/tests/custodian_v2/staged/ci_gate.py --reviewed-by-main
      - name: Reject optimized staged runtimes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          root = "ops/backup/tests/custodian_v2/staged/"
          for file, reason in (("ci_gate.py", "optimized_staged_ci_refused"), ("run_gate.py", "optimized_ipc_gate_refused"), ("verify_receipt.py", "optimized_staged_verifier_refused")):
              result = subprocess.run(["sudo", "-n", "--", "unshare", "--net", "/usr/bin/python3.12", "-I", "-S", "-B", "-O", root + file, "--reviewed-by-main"], capture_output=True, text=True, timeout=30, check=False)
              if result.returncode != 2 or result.stderr or json.loads(result.stdout) != {"outcome": "NOT_RUN", "reason": reason}:
                  raise SystemExit("optimized staged runtime did not return exact refusal")
          PY
