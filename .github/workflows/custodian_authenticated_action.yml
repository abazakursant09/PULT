name: Custodian Authenticated Synthetic Action

on:
  pull_request:
    paths:
      - ops/backup/**
      - backend/tests/test_custodian_action_*.py
      - .github/workflows/custodian_authenticated_action.yml
      - .gitattributes
  push:
    branches: [master]
    paths:
      - ops/backup/**
      - backend/tests/test_custodian_action_*.py
      - .github/workflows/custodian_authenticated_action.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-synthetic-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r backend/requirements-ci.lock
      - name: Guard source catalogue, workflow and action protocol
        run: python -m pytest backend/tests/test_custodian_action_protocol.py backend/tests/test_custodian_action_ci_guard.py -q
      - name: Download seven hash-pinned synthetic wheels
        run: |
          set -euo pipefail
          test -x /usr/bin/python3.12
          python -m pip download --only-binary=:all: --no-deps --require-hashes -r ops/backup/custodian/requirements.lock -d ops/backup/tests/custodian_v2/wheels
      - name: Real Linux atomic publication regression
        run: sudo -n -- /usr/bin/python3.12 -I -S -B ops/backup/tests/custodian_v2/action/test_atomic_attestation.py
      - name: Native authenticated action, crash, freeze and independent postcheck
        run: sudo -n -- unshare --net /usr/bin/python3.12 -I -S -B ops/backup/tests/custodian_v2/action/ci_gate.py --reviewed-by-main
      - name: Reject optimized proof entry points
        run: |
          python - <<'PY'
          import json
          import subprocess
          for file, reason in (("ci_gate.py", "optimized_action_ci_refused"), ("native_chain.py", "optimized_action_gate_refused")):
              command = ["sudo", "-n", "--", "unshare", "--net", "/usr/bin/python3.12", "-I", "-S", "-B", "-O", "ops/backup/tests/custodian_v2/action/" + file, "--reviewed-by-main"]
              result = subprocess.run(command, capture_output=True, text=True, timeout=30)
              if result.returncode != 2 or result.stderr or json.loads(result.stdout) != {"outcome":"NOT_RUN", "reason":reason}:
                  raise SystemExit("optimized action proof was not refused")
          PY
