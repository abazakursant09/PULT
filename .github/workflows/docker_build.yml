name: Docker Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      # SECURITY-2D-3B — any change to a runtime input or either lock must re-verify the image build.
      - backend/requirements.in
      - backend/requirements.lock
      - backend/requirements-ci.in
      - backend/requirements-ci.lock
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package-lock.json
      - docker-compose.yml
      - .github/workflows/docker_build.yml
  push:
    branches:
      - master
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      # SECURITY-2D-3B — any change to a runtime input or either lock must re-verify the image build.
      - backend/requirements.in
      - backend/requirements.lock
      - backend/requirements-ci.in
      - backend/requirements-ci.lock
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package-lock.json
      - docker-compose.yml
      - .github/workflows/docker_build.yml

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder
          SECRET_KEY: ci-placeholder
          CRED_ENC_KEY: ci-placeholder
          SMTP_HOST: smtp.example.com
          TELEGRAM_BOT_TOKEN: test:token
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.9.0
        with:
          context: ./backend
          push: false
          load: true
          tags: pult-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # SECURITY-2D-3C2 — prove the backend image runs non-root with a narrow writable allowlist. Pure
      # filesystem/id checks — no server start, no DATABASE_URL, no secrets, no provider calls, no push.
      - name: Backend non-root + writable-allowlist checks
        run: |
          set -e
          test "$(docker inspect -f '{{.Config.User}}' pult-backend:ci)" = "10001:10001"
          docker run --rm --entrypoint sh pult-backend:ci -c '
            set -e
            [ "$(id -u)" -ne 0 ] || { echo "FAIL: running as root"; exit 1; }
            touch /app/uploads/.canary && rm /app/uploads/.canary
            touch /tmp/.canary && rm /tmp/.canary
            if touch /app/main.py.canary 2>/dev/null; then echo "FAIL: /app writable"; rm -f /app/main.py.canary; exit 1; fi
            if touch /app/.canary 2>/dev/null; then echo "FAIL: /app root writable"; rm -f /app/.canary; exit 1; fi
          '

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.9.0
        with:
          context: ./frontend
          push: false
          load: true
          tags: pult-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # SECURITY-2D-3C3 — prove the frontend image runs non-root with a narrow writable surface. Pure
      # fs/id checks from the FINAL image user (no --user root); expected write failures are asserted,
      # not swallowed. No secrets, no push.
      - name: Frontend non-root + writable-allowlist checks
        run: |
          set -e
          test "$(docker inspect -f '{{.Config.User}}' pult-frontend:ci)" = "node"
          docker run --rm --entrypoint sh pult-frontend:ci -c '
            set -e
            [ "$(id -u)" -ne 0 ] || { echo "FAIL: running as root"; exit 1; }
            [ "$(id -u)" -eq 1000 ] || { echo "FAIL: not uid 1000"; exit 1; }
            touch /app/.next/cache/.canary && rm /app/.next/cache/.canary
            touch /tmp/.canary && rm /tmp/.canary
            if touch /app/.canary 2>/dev/null; then echo "FAIL: /app writable"; rm -f /app/.canary; exit 1; fi
            if touch /app/package.json.canary 2>/dev/null; then echo "FAIL: package.json area writable"; rm -f /app/package.json.canary; exit 1; fi
            if touch /app/node_modules/.canary 2>/dev/null; then echo "FAIL: node_modules writable"; rm -f /app/node_modules/.canary; exit 1; fi
            if touch /app/.next/server/.canary 2>/dev/null; then echo "FAIL: .next/server writable"; rm -f /app/.next/server/.canary; exit 1; fi
            if touch /app/.next/static/.canary 2>/dev/null; then echo "FAIL: .next/static writable"; rm -f /app/.next/static/.canary; exit 1; fi
            # /home/node is image-native writable — record honestly, not asserted read-only
            if touch /home/node/.canary 2>/dev/null; then echo "NOTE: /home/node writable (image-native design)"; rm -f /home/node/.canary; fi
          '

      # HTTP smoke of the FINAL image as its default non-root user (no backend, no real cookies/secrets).
      - name: Frontend HTTP smoke (non-root)
        run: |
          set -e
          docker run -d --name fe -p 3000:3000 pult-frontend:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/login 2>/dev/null; then break; fi
            sleep 2
          done
          echo "container user:"; docker exec fe id
          docker exec fe sh -c '[ "$(id -u)" -eq 1000 ]'          # runs as the non-root node user
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200"
          # /dashboard without a cookie → the middleware redirect to /login (NextResponse.redirect = 307).
          # Assert BOTH the exact redirect status AND the Location target — "not 200" alone is too weak.
          hdr=$(curl -s -D - -o /dev/null http://localhost:3000/dashboard)
          code=$(printf '%s' "$hdr" | awk 'NR==1{print $2}')
          loc=$(printf '%s' "$hdr" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          echo "/dashboard (no cookie) → $code  Location: $loc"
          case "$code" in 307|308) : ;; *) echo "FAIL: expected 307/308 redirect, got $code"; exit 1;; esac
          echo "$loc" | grep -q '/login' || { echo "FAIL: redirect Location is not /login"; exit 1; }
          # a real hashed JS chunk referenced by the home HTML must serve 200
          curl -s http://localhost:3000/ > home.html
          js=$(grep -oE '/_next/static/[^"]+\.js' home.html | head -1)
          echo "js chunk: $js"; test -n "$js" || { echo "FAIL: no /_next/static JS in home HTML"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$js")" = "200"
          # a CSS asset if the build emits one (App Router usually does); if inlined/absent, record honestly
          css=$(grep -oE '/_next/static/css/[^"]+\.css' home.html | head -1)
          if [ -n "$css" ]; then
            echo "css asset: $css"
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$css")" = "200"
          else
            echo "NOTE: no external /_next/static/css asset in home HTML (inlined) — CSS check skipped honestly"
          fi
          # no permission/startup errors in the non-root container logs
          if docker logs fe 2>&1 | grep -iE "EACCES|permission denied"; then echo "FAIL: permission error in logs"; exit 1; fi
          docker stop fe && docker rm fe
