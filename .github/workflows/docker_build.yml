name: Docker Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      - backend/requirements.txt
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package-lock.json
      - docker-compose.yml
      - .github/workflows/docker_build.yml
  push:
    branches:
      - master
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      - backend/requirements.txt
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package-lock.json
      - docker-compose.yml
      - .github/workflows/docker_build.yml

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder
          SECRET_KEY: ci-placeholder
          CRED_ENC_KEY: ci-placeholder
          SMTP_HOST: smtp.example.com
          TELEGRAM_BOT_TOKEN: test:token
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pult-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # SECURITY-2D-3C2 — prove the backend image runs non-root with a narrow writable allowlist. Pure
      # filesystem/id checks — no server start, no DATABASE_URL, no secrets, no provider calls, no push.
      - name: Backend non-root + writable-allowlist checks
        run: |
          set -e
          test "$(docker inspect -f '{{.Config.User}}' pult-backend:ci)" = "10001:10001"
          docker run --rm --entrypoint sh pult-backend:ci -c '
            set -e
            [ "$(id -u)" -ne 0 ] || { echo "FAIL: running as root"; exit 1; }
            touch /app/uploads/.canary && rm /app/uploads/.canary
            touch /tmp/.canary && rm /tmp/.canary
            if touch /app/main.py.canary 2>/dev/null; then echo "FAIL: /app writable"; rm -f /app/main.py.canary; exit 1; fi
            if touch /app/.canary 2>/dev/null; then echo "FAIL: /app root writable"; rm -f /app/.canary; exit 1; fi
          '

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
