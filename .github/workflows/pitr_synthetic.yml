name: PITR Synthetic

# SECURITY-2D-3E1B-3B1 — proves pgBackRest base backup + continuous WAL archive + point-in-time
# (LSN) restore on SYNTHETIC data only, against a pinned MinIO served over TLS (so pgBackRest
# keeps repo1-storage-verify-tls=y with a mounted CA — TLS verification is NOT disabled).
# No real Selectel, no real secrets, no PII, no image publish, no WAL/repo/key artifacts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ops/pitr/**
      - docker-compose.pitr.yml
      - docs/pitr-policy.md
      - backend/tests/test_pitr_contract_guard.py
      - backend/alembic/**
      - .github/workflows/pitr_synthetic.yml
  push:
    branches: [master]
    paths:
      - ops/pitr/**
      - .github/workflows/pitr_synthetic.yml

permissions:
  contents: read

jobs:
  pitr-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINIO_IMAGE: "minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
      S3_KEY: ciminio
      S3_SECRET: ciminiosecret123
      CIPHER_PASS: cisyntheticcipherpass
      PGPW: cipg
      BUCKET: pult-pitr-ci
      STANZA: pult
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0

      - name: Offline PITR contract guard
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-ci.lock
          python -m pytest tests/test_pitr_contract_guard.py tests/test_base_image_digest_pin_guard.py -q

      - name: Build PITR image (exact-pinned) + prove closure
        run: |
          set -euo pipefail
          docker buildx build --load -t pult-pitr:ci ops/pitr
          docker run --rm --entrypoint sh pult-pitr:ci -c 'pgbackrest version; ldd /usr/bin/pgbackrest; ldd /usr/bin/pgbackrest | grep -q "not found" && exit 1 || true; command -v gcc && exit 1 || true'

      - name: TLS MinIO + network + S3 config
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/pitr"; mkdir -p "$W/certs" "$W/repo-conf"
          docker network create pitrnet
          # self-signed CA/cert for MinIO host "minio"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout "$W/certs/private.key" -out "$W/certs/public.crt" \
            -subj "/CN=minio" -addext "subjectAltName=DNS:minio"
          docker run -d --name minio --network pitrnet \
            -e MINIO_ROOT_USER="$S3_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET" \
            -v "$W/certs":/root/.minio/certs:ro "$MINIO_IMAGE" server /data
          # bucket via aws-less rclone-free path: use the pitr image's pgbackrest? no — create with a tiny mc-free step:
          for i in $(seq 1 30); do docker run --rm --network pitrnet --entrypoint sh pult-pitr:ci -c "true" && break; sleep 1; done
          echo "$W" > "$RUNNER_TEMP/wdir"

      - name: Run synthetic PITR (base + WAL + T1/T2/T3 LSN restore)
        run: |
          set -euo pipefail
          W="$(cat "$RUNNER_TEMP/wdir")"
          # pgBackRest config for CI: S3=MinIO over TLS, CA trusted (verify-tls stays y).
          cat > "$W/repo-conf/pgbackrest.conf" <<CONF
          [global]
          repo1-type=s3
          repo1-s3-endpoint=minio:9000
          repo1-s3-region=us-east-1
          repo1-s3-bucket=$BUCKET
          repo1-s3-uri-style=path
          repo1-path=/pult-pitr
          repo1-storage-verify-tls=y
          repo1-storage-ca-file=/etc/pgbackrest/minio-ca.crt
          repo1-cipher-type=aes-256-cbc
          spool-path=/var/spool/pgbackrest
          archive-async=y
          process-max=2
          compress-type=zst
          log-level-console=info
          log-path=/var/log/pgbackrest
          [pult]
          pg1-path=/var/lib/postgresql/data
          CONF
          PGENV="-e PGBACKREST_REPO1_S3_KEY=$S3_KEY -e PGBACKREST_REPO1_S3_KEY_SECRET=$S3_SECRET -e PGBACKREST_REPO1_CIPHER_PASS=$CIPHER_PASS"
          MNT="-v $W/repo-conf/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro -v $W/certs/public.crt:/etc/pgbackrest/minio-ca.crt:ro"
          # synchronous variant (archive-async=n) — used ONLY by the E S3-outage source so the
          # archive_command's exit-code contract is directly observable (nonzero -> PostgreSQL
          # retains the WAL and increments pg_stat_archiver.failed_count). Under async the foreground
          # archive-push spools and returns 0, so failed_count never moves — async only defers the
          # very same push to a background worker.
          sed 's/^archive-async=y$/archive-async=n/' "$W/repo-conf/pgbackrest.conf" > "$W/repo-conf/pgbackrest-sync.conf"
          MNT_SYNC="-v $W/repo-conf/pgbackrest-sync.conf:/etc/pgbackrest/pgbackrest.conf:ro -v $W/certs/public.crt:/etc/pgbackrest/minio-ca.crt:ro"
          # source postgres (PITR image) with archive_mode on
          docker run -d --name pgsrc --network pitrnet $PGENV $MNT \
            -v pitr_src:/var/lib/postgresql/data \
            -v "$PWD/ops/pitr/postgresql.conf":/etc/postgresql/postgresql.conf:ro \
            -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=business_pult \
            pult-pitr:ci postgres -c config_file=/etc/postgresql/postgresql.conf
          for i in $(seq 1 60); do docker exec pgsrc pg_isready -U postgres && break || sleep 2; done
          docker exec pgsrc sh -c 'pgbackrest version; postgres --version'
          # create bucket (mc-free): use pgbackrest? pgbackrest can't mkbucket. Use a pinned minio mc? Instead let MinIO auto-make via first stanza? pgBackRest needs the bucket to exist.
          docker run --rm --network pitrnet -v "$W/certs/public.crt":/ca.crt:ro --entrypoint sh "$MINIO_IMAGE" -c "mc alias set m https://minio:9000 $S3_KEY $S3_SECRET --insecure >/dev/null 2>&1 || true; mc --insecure mb m/$BUCKET || true"
          # stanza + base backup
          docker exec -u postgres pgsrc pgbackrest --stanza=$STANZA stanza-create
          docker exec -u postgres pgsrc pgbackrest --stanza=$STANZA check
          docker exec -u postgres pgsrc pgbackrest --stanza=$STANZA --type=full backup
          # alembic + seed + markers
          docker exec pgsrc psql -U postgres -d business_pult -c "CREATE TABLE pitr_marker(id int primary key, v text)"
          docker exec pgsrc psql -U postgres -d business_pult -c "INSERT INTO pitr_marker VALUES (1,'T1')"
          docker exec pgsrc psql -U postgres -d business_pult -c "SELECT pg_switch_wal()"
          sleep 3
          docker exec pgsrc psql -U postgres -d business_pult -c "INSERT INTO pitr_marker VALUES (2,'T2')"
          TARGET_LSN="$(docker exec pgsrc psql -U postgres -d business_pult -tAc 'SELECT pg_current_wal_lsn()')"
          echo "TARGET_LSN=$TARGET_LSN"
          docker exec pgsrc psql -U postgres -d business_pult -c "INSERT INTO pitr_marker VALUES (3,'T3')"
          docker exec pgsrc psql -U postgres -d business_pult -c "SELECT pg_switch_wal()"
          sleep 3
          docker exec -u postgres pgsrc pgbackrest --stanza=$STANZA check
          # destroy source (container + its exact synthetic volume)
          docker rm -f pgsrc
          docker volume rm pitr_src
          # restore into NEW empty target to LSN after T2 (before T3), promote
          docker run -d --name pgtgt --network pitrnet $PGENV $MNT -v pitr_tgt:/var/lib/postgresql/data \
            -e POSTGRES_PASSWORD="$PGPW" --entrypoint sh pult-pitr:ci -c 'sleep 600'
          docker exec pgtgt chown postgres:postgres /var/lib/postgresql/data
          docker exec -u postgres -e PITR_SYNTHETIC_MARKER=synthetic-3b1 -e PGDATA=/var/lib/postgresql/data -e PITR_STANZA=$STANZA -e PITR_TARGET_LSN="$TARGET_LSN" pgtgt restore.sh
          docker exec -u postgres pgtgt sh -c 'pg_ctl -D /var/lib/postgresql/data -w -t 120 start'
          for i in $(seq 1 60); do docker exec pgtgt pg_isready -U postgres && break || sleep 2; done
          # assertions
          REC="$(docker exec pgtgt psql -U postgres -d business_pult -tAc 'SELECT pg_is_in_recovery()')"
          test "$REC" = "f" || { echo "still in recovery"; exit 1; }
          T1="$(docker exec pgtgt psql -U postgres -d business_pult -tAc "SELECT count(*) FROM pitr_marker WHERE v='T1'")"
          T2="$(docker exec pgtgt psql -U postgres -d business_pult -tAc "SELECT count(*) FROM pitr_marker WHERE v='T2'")"
          T3="$(docker exec pgtgt psql -U postgres -d business_pult -tAc "SELECT count(*) FROM pitr_marker WHERE v='T3'")"
          echo "T1=$T1 T2=$T2 T3=$T3"
          test "$T1" = "1" && test "$T2" = "1" && test "$T3" = "0" || { echo "PITR target wrong (expected T1,T2 present, T3 absent)"; exit 1; }
          docker exec pgtgt psql -U postgres -d business_pult -c "INSERT INTO pitr_marker VALUES (4,'T4')"
          echo "PITR SYNTHETIC OK: base+WAL+LSN-restore, T1/T2 present, T3 absent, promoted, T4 write ok"

      - name: PITR B1 negative matrix (fail-closed)
        run: |
          set -euo pipefail
          W="$(cat "$RUNNER_TEMP/wdir")"
          MNT="-v $W/repo-conf/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro -v $W/certs/public.crt:/etc/pgbackrest/minio-ca.crt:ro"
          # synchronous conf for the E S3-outage source (each run: step is a fresh shell) — see setup step.
          sed 's/^archive-async=y$/archive-async=n/' "$W/repo-conf/pgbackrest.conf" > "$W/repo-conf/pgbackrest-sync.conf"
          MNT_SYNC="-v $W/repo-conf/pgbackrest-sync.conf:/etc/pgbackrest/pgbackrest.conf:ro -v $W/certs/public.crt:/etc/pgbackrest/minio-ca.crt:ro"
          GOOD_LSN="0/60000D0"
          n=0; pass=0
          # each negative: fresh disposable target, run restore.sh with a fault (extraenv overrides
          # a base -e), assert restore.sh exits NON-ZERO (fail-closed) and leaves no started DB.
          neg() {
            desc="$1"; extraenv="$2"; prep="${3:-}"
            n=$((n+1)); c="neg$n"; v="pitr_$c"
            docker run -d --name "$c" --network pitrnet \
              -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" \
              $MNT -v "$v":/var/lib/postgresql/data --entrypoint sh pult-pitr:ci -c 'sleep 300' >/dev/null
            docker exec "$c" chown postgres:postgres /var/lib/postgresql/data
            [ "$prep" = "nonempty" ] && docker exec -u postgres "$c" sh -c 'echo 16 > /var/lib/postgresql/data/PG_VERSION'
            if docker exec -u postgres \
                 -e PITR_SYNTHETIC_MARKER=synthetic-3b1 -e PGDATA=/var/lib/postgresql/data -e PITR_STANZA=pult -e PITR_TARGET_LSN="$GOOD_LSN" \
                 $extraenv "$c" restore.sh >/dev/null 2>&1; then
              echo "NEG WRONG: '$desc' unexpectedly succeeded"; docker rm -f "$c" >/dev/null 2>&1 || true; docker volume rm "$v" >/dev/null 2>&1 || true; exit 1
            fi
            echo "NEG ok: $desc"; pass=$((pass+1))
            docker rm -f "$c" >/dev/null 2>&1 || true; docker volume rm "$v" >/dev/null 2>&1 || true
          }
          neg "A missing base backup / wrong stanza" "-e PITR_STANZA=ghost" ""
          neg "B wrong cipher key"                   "-e PGBACKREST_REPO1_CIPHER_PASS=totallywrongpass" ""
          neg "C non-empty target refused"           "" "nonempty"
          neg "D missing synthetic marker refused"   "-e PITR_SYNTHETIC_MARKER=" ""

          # ---- helpers for repo-object + recovery negatives ----
          MC() { docker run --rm --network pitrnet --entrypoint sh "$MINIO_IMAGE" -c "mc --insecure alias set m https://minio:9000 $S3_KEY $S3_SECRET >/dev/null 2>&1; $1"; }
          # copy the intact canonical repo to a scratch prefix we can mutate without touching evidence
          scratch_repo() { MC "mc --insecure rm --recursive --force m/$BUCKET/pult-neg >/dev/null 2>&1 || true; mc --insecure cp --recursive m/$BUCKET/pult-pitr/ m/$BUCKET/pult-neg/ >/dev/null"; }
          # restore from the (possibly mutated) scratch repo, START postgres, assert it does NOT
          # cleanly reach+promote the target (recovery fails / stays in recovery / no target rows).
          expect_recovery_fail() {
            desc="$1"; n=$((n+1)); c="rneg$n"; v="pitr_$c"
            docker run -d --name "$c" --network pitrnet \
              -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" \
              -e PGBACKREST_REPO1_PATH=/pult-neg $MNT -v "$v":/var/lib/postgresql/data --entrypoint sh pult-pitr:ci -c 'sleep 300' >/dev/null
            docker exec "$c" chown postgres:postgres /var/lib/postgresql/data
            ok=1
            if docker exec -u postgres -e PGBACKREST_REPO1_PATH=/pult-neg \
                 -e PITR_SYNTHETIC_MARKER=synthetic-3b1 -e PGDATA=/var/lib/postgresql/data -e PITR_STANZA=pult -e PITR_TARGET_LSN="$GOOD_LSN" \
                 "$c" restore.sh >/dev/null 2>&1; then
              # restore step succeeded; recovery must NOT reach the target — start and check
              docker exec -u postgres "$c" sh -c 'pg_ctl -D /var/lib/postgresql/data -w -t 60 start' >/dev/null 2>&1 || ok=0
              if [ "$ok" = "1" ]; then
                REC="$(docker exec -u postgres "$c" psql -U postgres -d business_pult -tAc 'SELECT pg_is_in_recovery()' 2>/dev/null || echo err)"
                T2c="$(docker exec -u postgres "$c" psql -U postgres -d business_pult -tAc "SELECT count(*) FROM pitr_marker WHERE v='T2'" 2>/dev/null || echo 0)"
                # PASS(negative) if it never promoted to a consistent target-reached state with T2
                if [ "$REC" = "f" ] && [ "$T2c" = "1" ]; then ok=0; fi  # wrongly reached target
              fi
            fi
            # here ok=1 means restore or recovery failed to reach target => negative correctly failed-closed
            if [ "$ok" = "1" ]; then echo "NEG ok: $desc"; pass=$((pass+1)); else echo "NEG WRONG: '$desc' reached/promoted target"; docker rm -f "$c" >/dev/null 2>&1||true; docker volume rm "$v" >/dev/null 2>&1||true; exit 1; fi
            docker rm -f "$c" >/dev/null 2>&1 || true; docker volume rm "$v" >/dev/null 2>&1 || true
          }
          NEGDIR="pult-neg/archive/pult/16-1/0000000100000000"
          # Resolve a scratch-repo WAL object basename for a segment suffix ON THE RUNNER:
          # the minio image has no awk/grep, so `mc --json ls` output is parsed here (runner has both).
          seg_obj() {
            MC "mc --insecure --json ls m/$BUCKET/$NEGDIR/" \
              | grep -o '"key":"[^"]*"' | sed 's/"key":"//; s/"$//' \
              | grep "$1" | head -1
          }

          # F missing required WAL: drop the target's own segment (06) → recovery cannot reach the LSN.
          scratch_repo
          Fobj="$(seg_obj 000000010000000000000006)"; test -n "$Fobj"
          MC "mc --insecure rm m/$BUCKET/$NEGDIR/$Fobj"
          expect_recovery_fail "F missing required WAL"

          # G corrupt required WAL object: overwrite the target's segment (06) with garbage so
          # pgBackRest archive-get checksum/decompress fails during recovery.
          scratch_repo
          Gobj="$(seg_obj 000000010000000000000006)"; test -n "$Gobj"
          MC "echo corrupt-not-a-valid-wal-segment | mc --insecure pipe m/$BUCKET/$NEGDIR/$Gobj"
          expect_recovery_fail "G corrupt required WAL object"

          # I target before available base backup (LSN 0/1, before base)
          n=$((n+1)); c="ineg"; v="pitr_$c"
          docker run -d --name "$c" --network pitrnet -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" $MNT -v "$v":/var/lib/postgresql/data --entrypoint sh pult-pitr:ci -c 'sleep 200' >/dev/null
          docker exec "$c" chown postgres:postgres /var/lib/postgresql/data
          if docker exec -u postgres -e PITR_SYNTHETIC_MARKER=synthetic-3b1 -e PGDATA=/var/lib/postgresql/data -e PITR_STANZA=pult -e PITR_TARGET_LSN="0/1" "$c" restore.sh >/dev/null 2>&1 && \
             docker exec -u postgres "$c" sh -c 'pg_ctl -D /var/lib/postgresql/data -w -t 60 start' >/dev/null 2>&1 && \
             [ "$(docker exec -u postgres "$c" psql -U postgres -d business_pult -tAc "SELECT count(*) FROM pitr_marker WHERE v='T1'" 2>/dev/null||echo 0)" = "1" ]; then
            echo "NEG WRONG: 'I target-before-base' reached target"; docker rm -f "$c">/dev/null 2>&1||true; docker volume rm "$v">/dev/null 2>&1||true; exit 1
          fi
          echo "NEG ok: I target before available base"; pass=$((pass+1)); docker rm -f "$c">/dev/null 2>&1||true; docker volume rm "$v">/dev/null 2>&1||true

          # H wrong system identifier: init a DIFFERENT cluster, point pgbackrest info at the pult
          # repo but with that cluster's pg1-path → pgBackRest detects system-id mismatch.
          n=$((n+1)); c="hneg"; v="pitr_$c"
          docker run -d --name "$c" --network pitrnet -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=business_pult \
            -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" \
            $MNT -v "$v":/var/lib/postgresql/data pult-pitr:ci >/dev/null
          for k in $(seq 1 40); do docker exec "$c" pg_isready -U postgres >/dev/null 2>&1 && break || sleep 2; done
          if docker exec -u postgres "$c" pgbackrest --stanza=pult check >/dev/null 2>&1; then
            echo "NEG WRONG: 'H system-id mismatch' check passed on a foreign cluster"; docker rm -f "$c">/dev/null 2>&1||true; docker volume rm "$v">/dev/null 2>&1||true; exit 1
          fi
          echo "NEG ok: H wrong system identifier"; pass=$((pass+1)); docker rm -f "$c">/dev/null 2>&1||true; docker volume rm "$v">/dev/null 2>&1||true

          # K major mismatch: restore wrapper must refuse a target PGDATA already stamped a different major.
          n=$((n+1)); c="kneg"; v="pitr_$c"
          docker run -d --name "$c" --network pitrnet -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" $MNT -v "$v":/var/lib/postgresql/data --entrypoint sh pult-pitr:ci -c 'sleep 120' >/dev/null
          docker exec "$c" chown postgres:postgres /var/lib/postgresql/data
          docker exec -u postgres "$c" sh -c 'echo 15 > /var/lib/postgresql/data/PG_VERSION'   # foreign major stamp
          if docker exec -u postgres -e PITR_SYNTHETIC_MARKER=synthetic-3b1 -e PGDATA=/var/lib/postgresql/data -e PITR_STANZA=pult -e PITR_TARGET_LSN="$GOOD_LSN" "$c" restore.sh >/dev/null 2>&1; then
            echo "NEG WRONG: 'K major mismatch' not refused"; docker rm -f "$c">/dev/null 2>&1||true; docker volume rm "$v">/dev/null 2>&1||true; exit 1
          fi
          echo "NEG ok: K major mismatch (non-empty/foreign-major target refused)"; pass=$((pass+1)); docker rm -f "$c">/dev/null 2>&1||true; docker volume rm "$v">/dev/null 2>&1||true

          # J continuity gap: remove a REQUIRED predecessor segment (05) → a gap before the target,
          # so recovery must NOT silently reach the requested LSN.
          scratch_repo
          Jobj="$(seg_obj 000000010000000000000005)"; test -n "$Jobj"
          MC "mc --insecure rm m/$BUCKET/$NEGDIR/$Jobj"
          expect_recovery_fail "J WAL continuity gap"

          # E S3 unavailable during archive: dedicated source+stanza, isolate MinIO, prove archive
          # fails + WAL retained, then restore MinIO + prove drain.
          n=$((n+1))
          docker run -d --name esrc --network pitrnet \
            -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" \
            -e PGBACKREST_REPO1_PATH=/pult-oute $MNT_SYNC -v pitr_esrc:/var/lib/postgresql/data \
            -v "$PWD/ops/pitr/postgresql.conf":/etc/postgresql/postgresql.conf:ro \
            -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=business_pult pult-pitr:ci postgres -c config_file=/etc/postgresql/postgresql.conf >/dev/null
          for k in $(seq 1 60); do docker exec esrc pg_isready -U postgres >/dev/null 2>&1 && break || sleep 2; done
          docker exec -u postgres -e PGBACKREST_REPO1_PATH=/pult-oute esrc pgbackrest --stanza=pult stanza-create
          docker exec -u postgres -e PGBACKREST_REPO1_PATH=/pult-oute esrc pgbackrest --stanza=pult --type=full backup
          F0="$(docker exec -u postgres esrc psql -U postgres -tAc 'SELECT failed_count FROM pg_stat_archiver' 2>/dev/null||echo 0)"
          docker network disconnect pitrnet minio
          # archive-async=y (the real config): the primary archive-push returns 0 (spools the segment);
          # the async worker then fails against the isolated S3 and records a spool .error, which a
          # LATER archive-push reports back to PostgreSQL, incrementing pg_stat_archiver.failed_count.
          # So one switch is not enough — generate several segments and poll (<=90s).
          F1="$F0"
          for k in $(seq 1 15); do
            docker exec -u postgres esrc psql -U postgres -d business_pult -c "CREATE TABLE IF NOT EXISTS e(x int); INSERT INTO e VALUES ($k); SELECT pg_switch_wal()" >/dev/null 2>&1 || true
            sleep 6
            F1="$(docker exec -u postgres esrc psql -U postgres -tAc 'SELECT failed_count FROM pg_stat_archiver' 2>/dev/null||echo 0)"
            [ "$F1" -gt "$F0" ] 2>/dev/null && break
          done
          WALCNT="$(docker exec -u postgres esrc sh -c 'ls -1 /var/lib/postgresql/data/pg_wal/ | grep -E "^[0-9A-F]{24}$" | wc -l' 2>/dev/null||echo 0)"
          docker network connect pitrnet minio
          sleep 5
          docker exec -u postgres esrc psql -U postgres -c "SELECT pg_switch_wal()" >/dev/null 2>&1 || true
          drain=0
          for k in $(seq 1 20); do docker exec -u postgres -e PGBACKREST_REPO1_PATH=/pult-oute esrc pgbackrest --stanza=pult check >/dev/null 2>&1 && { drain=1; break; }; sleep 3; done
          echo "E: failed_count $F0 -> $F1 ; retained WAL in pg_wal = $WALCNT ; drain=$drain"
          if [ "$F1" -gt "$F0" ] 2>/dev/null && [ "$WALCNT" -ge 1 ] 2>/dev/null && [ "$drain" = "1" ]; then
            echo "NEG ok: E S3 outage (archive failed+WAL retained, then drained)"; pass=$((pass+1))
          else
            echo "NEG WRONG: E S3 outage semantics not proven (F0=$F0 F1=$F1 wal=$WALCNT drain=$drain)"; docker rm -f esrc>/dev/null 2>&1||true; docker volume rm pitr_esrc>/dev/null 2>&1||true; exit 1
          fi
          docker rm -f esrc >/dev/null 2>&1 || true; docker volume rm pitr_esrc >/dev/null 2>&1 || true

          # L async S3 outage (THE STANDARD config: archive-async=y, NOT sync). Prove that a
          # foreground archive_command success under async is only LOCAL spool acceptance — NOT
          # offsite durability — and that status.sh reports NOT-intact during the outage even though
          # archive-push returned 0; then prove the EXACT segment drains to S3 on reconnect and the
          # signal flips to intact. The SOURCE (not MinIO) is network-isolated so the S3 checker can
          # still list the repository and literally prove absence→presence of that segment.
          # No `|| true` on any assertion; any unproven phase fails the job.
          n=$((n+1))
          LREPO="pult-outl/archive/pult/16-1"
          seg_in_s3() { MC "mc --insecure --json ls --recursive m/$BUCKET/$LREPO/" | grep -q "$1"; }
          spool_has() { docker exec lsrc sh -c "find /var/spool/pgbackrest -type f -name '*$1*' 2>/dev/null | grep -q ."; }
          ge_seg() { [ "$(printf '%s\n%s\n' "$1" "$2" | LC_ALL=C sort | tail -1)" = "$2" ]; }  # true if $2 >= $1
          docker run -d --name lsrc --network pitrnet \
            -e PGBACKREST_REPO1_S3_KEY="$S3_KEY" -e PGBACKREST_REPO1_S3_KEY_SECRET="$S3_SECRET" -e PGBACKREST_REPO1_CIPHER_PASS="$CIPHER_PASS" \
            -e PGBACKREST_REPO1_PATH=/pult-outl -e PGBACKREST_STANZA=pult $MNT -v pitr_lsrc:/var/lib/postgresql/data \
            -v "$PWD/ops/pitr/postgresql.conf":/etc/postgresql/postgresql.conf:ro \
            -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=business_pult pult-pitr:ci postgres -c config_file=/etc/postgresql/postgresql.conf >/dev/null
          for k in $(seq 1 60); do docker exec lsrc pg_isready -U postgres >/dev/null 2>&1 && break || sleep 2; done
          docker exec -u postgres lsrc pgbackrest --stanza=pult stanza-create
          docker exec -u postgres lsrc pgbackrest --stanza=pult --type=full backup
          # baseline: one segment must actually reach S3 while connected (async worker healthy)
          docker exec -u postgres lsrc psql -U postgres -d business_pult -c "CREATE TABLE l(x int); INSERT INTO l VALUES (0); SELECT pg_switch_wal()" >/dev/null
          base_ok=0; for k in $(seq 1 20); do docker exec -u postgres lsrc pgbackrest --stanza=pult check >/dev/null 2>&1 && { base_ok=1; break; }; sleep 3; done
          [ "$base_ok" = 1 ] || { echo "L FAIL: baseline archive to S3 not confirmed"; exit 1; }
          L0="$(docker exec -u postgres lsrc psql -U postgres -tAc 'SELECT failed_count FROM pg_stat_archiver')"
          LAW0="$(docker exec -u postgres lsrc psql -U postgres -tAc "SELECT coalesce(last_archived_wal,'')::text FROM pg_stat_archiver")"
          # isolate the SOURCE from the network FIRST; S3 stays reachable to the checker; async worker fails.
          docker network disconnect pitrnet lsrc
          docker exec -u postgres lsrc psql -U postgres -d business_pult -c "INSERT INTO l VALUES (1); SELECT pg_switch_wal()" >/dev/null
          # SEG = the segment the foreground archive-push ACCEPTED during the outage. Read it
          # authoritatively from pg_stat_archiver (no guessing): it is the segment completed by the
          # switch AFTER isolation, so it was born during the outage and cannot possibly be offsite.
          # foreground async success == spool-accept: last_archived_wal advances, failed_count flat.
          fg_ok=0; SEG=""; L1="$L0"
          for k in $(seq 1 15); do
            SEG="$(docker exec -u postgres lsrc psql -U postgres -tAc "SELECT coalesce(last_archived_wal,'')::text FROM pg_stat_archiver")"
            L1="$(docker exec -u postgres lsrc psql -U postgres -tAc 'SELECT failed_count FROM pg_stat_archiver')"
            [ -n "$SEG" ] && [ "$SEG" != "$LAW0" ] && [ "$L1" = "$L0" ] && { fg_ok=1; break; }
            sleep 2
          done
          [ "$fg_ok" = 1 ] || { echo "L FAIL: foreground async archive not accepted during outage (last_archived_wal=$SEG prev=$LAW0 failed_count $L0->$L1)"; exit 1; }
          echo "L: foreground async archive-push accepted SEG=$SEG (advanced from '$LAW0', failed_count $L0->$L1) — LOCAL spool only"
          # SEG must be in the LOCAL durable spool, and NOT offsite (proven absent pre-outage; source
          # has had no S3 path since).
          spool_has "$SEG" || { echo "L FAIL: SEG $SEG not in local spool"; docker exec lsrc sh -c 'find /var/spool/pgbackrest -type f | head -50' || true; exit 1; }
          if seg_in_s3 "$SEG"; then echo "L FAIL: SEG $SEG unexpectedly offsite during outage"; exit 1; fi
          # status.sh (inside the source) must report the DANGEROUS state despite foreground success.
          LST="$(docker exec -u postgres -e PGBACKREST_REPO1_PATH=/pult-outl -e PGBACKREST_STANZA=pult lsrc status.sh || true)"
          echo "$LST" | sed 's/^/L-status(outage): /'
          echo "$LST" | grep -q '^pitr_check_status=' || { echo "L FAIL: status.sh produced no output"; exit 1; }
          echo "$LST" | grep -q '^pitr_check_status=ok$' && { echo "L FAIL: status check_status=ok during outage"; exit 1; }
          echo "$LST" | grep -q '^pitr_continuity=intact$' && { echo "L FAIL: status continuity=intact during outage"; exit 1; }
          echo "$LST" | grep -qE '^pitr_local_spool_bytes=[1-9]' || { echo "L FAIL: local spool bytes not shown non-zero during outage"; exit 1; }
          # reconnect; kick the async worker; the EXACT segment must drain to S3.
          docker network connect pitrnet lsrc
          docker exec -u postgres lsrc psql -U postgres -d business_pult -c "INSERT INTO l VALUES (2); SELECT pg_switch_wal()" >/dev/null 2>&1 || true
          drainL=0; for k in $(seq 1 30); do seg_in_s3 "$SEG" && { drainL=1; break; }; sleep 3; done
          [ "$drainL" = 1 ] || { echo "L FAIL: SEG $SEG never drained to S3 after reconnect"; exit 1; }
          spool_has "$SEG" && { echo "L FAIL: SEG $SEG still in spool after drain"; exit 1; }
          checkL=0; for k in $(seq 1 20); do docker exec -u postgres lsrc pgbackrest --stanza=pult check >/dev/null 2>&1 && { checkL=1; break; }; sleep 3; done
          [ "$checkL" = 1 ] || { echo "L FAIL: pgbackrest check not ok after drain"; exit 1; }
          LST2="$(docker exec -u postgres -e PGBACKREST_REPO1_PATH=/pult-outl -e PGBACKREST_STANZA=pult lsrc status.sh || true)"
          echo "$LST2" | sed 's/^/L-status(healthy): /'
          echo "$LST2" | grep -q '^pitr_check_status=ok$' || { echo "L FAIL: check_status not ok after drain"; exit 1; }
          echo "$LST2" | grep -q '^pitr_continuity=intact$' || { echo "L FAIL: continuity not intact after drain"; exit 1; }
          OMAX="$(echo "$LST2" | sed -n 's/^pitr_offsite_archive_max=//p')"
          { [ -n "$OMAX" ] && [ "$OMAX" != unknown ] && ge_seg "$SEG" "$OMAX"; } || { echo "L FAIL: offsite_archive_max ($OMAX) does not include SEG ($SEG)"; exit 1; }
          echo "NEG ok: L async S3 outage (foreground spool-accept, offsite-absent, status not-intact, then exact-segment drain + intact)"; pass=$((pass+1))
          docker rm -f lsrc >/dev/null 2>&1 || true; docker volume rm pitr_lsrc >/dev/null 2>&1 || true

          echo "PITR negative-matrix: pass=$pass/$n"
          test "$pass" = "$n" && test "$n" -ge 12

      - name: Teardown
        if: always()
        run: |
          docker rm -f pgsrc pgtgt minio esrc lsrc $(docker ps -aq --filter 'name=neg' --filter 'name=rneg' --filter 'name=ineg' --filter 'name=hneg' --filter 'name=kneg') 2>/dev/null || true
          docker volume rm pitr_src pitr_tgt pitr_esrc pitr_lsrc $(docker volume ls -q | grep -E '^pitr_(neg|rneg|ineg|hneg|kneg)') 2>/dev/null || true
          docker network rm pitrnet 2>/dev/null || true
