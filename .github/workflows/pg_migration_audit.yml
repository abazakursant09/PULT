name: PG Migration Audit (investigation)

# INVESTIGATION-ONLY throwaway workflow: runs the REAL Alembic chain base->head on a clean
# PostgreSQL 16 and reports EVERY PostgreSQL-incompatible migration. Makes no committed migration
# change. Deleted after the audit.
on:
  push:
    branches:
      - codex/pg-migration-audit

jobs:
  pg-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pult_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary asyncpg
      - name: Run PostgreSQL migration audit
        env:
          PG_ALEMBIC_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pult_audit
          PG_SYNC_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pult_audit
        run: python _pg_migration_audit.py
