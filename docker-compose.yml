version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_pult
      POSTGRES_USER: postgres
      # No default. The password used to be the literal "postgres", written into this file and
      # therefore into the repository, on a database that holds every seller's imported revenue.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -hex 24)}
    # The port is NOT published. The backend reaches the database over the compose network, so
    # publishing 5432 bought nothing and exposed the database on every interface the host has.
    # For local administration, bind it to loopback only by uncommenting the line below — then it
    # is reachable from the host itself (psql, a tunnel) and from nowhere else on the network.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is gone. Nothing in the repository connects to it: `redis_url` is declared in
  # config.py:23 and read by no code, no redis client is installed (it is not in
  # backend/requirements.txt), and the one place that could have needed a broker says so
  # explicitly — routers/ai_image_service.py:10, "Queue: asyncio background loop (no
  # Redis/Celery)". It was a container with a published port and no purpose.

  backend:
    build: ./backend
    restart: unless-stopped
    # Loopback only. "8000:8000" binds to every interface the host has, so the API was reachable
    # directly — over plain HTTP, past whatever TLS and rate limiting sit in front of it. Note
    # that a host firewall is not a reliable answer here: Docker writes its own iptables rules
    # (DOCKER chain, applied before the filter rules ufw manages), so a published port can stay
    # open even when the firewall is told to deny it. Binding to 127.0.0.1 is enforced by Docker
    # itself and needs no firewall to be correct.
    #
    # REQUIRED as a consequence: an HTTPS-terminating reverse proxy (Caddy, nginx, Traefik) in
    # front of these two services. There is none in this file, by design — it is host-specific.
    # Without it, nothing is publicly reachable at all.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/business_pult
      # Used in exactly one place: the CSP connect-src header this backend puts on its own
      # responses (main.py:40). Unset, it fell back to http://localhost:8000 (config.py:30), so
      # production responses advertised a localhost origin. Nothing a seller can observe changes
      # — the pages they load are served by Next.js with its own CSP — but the header should not
      # claim localhost in production.
      API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (openssl rand -hex 32)}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      # CRITICAL prod secrets — startup fails fast if these are missing.
      CRED_ENC_KEY: ${CRED_ENC_KEY:?CRED_ENC_KEY must be set (python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set for email verification / reset}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Telegram ships in the first release, so the token is required — not optional.
      # services/telegram.py reads it with os.getenv and the backend calls no load_dotenv, so a
      # token in backend/.env would never reach the sender: it has to arrive as a process
      # environment variable, which is what this line does. Unset, delivery would fail silently
      # (telegram.py:17-19 returns False) while Аккаунт still offered the seller a Chat ID form,
      # a "Тест" button and three notification switches. Fail fast instead.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set - the Account page presents Telegram as working, so it must work}
      # Recommended in production (empty → graceful no-op).
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Payments (optional for Advisory MVP).
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # Shared secret for internal/cron-only control endpoints (close-due
      # measurement trigger). Empty default → fail-closed when unset.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Backend API URL is baked into the client bundle at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    # Loopback only, for the same reason as the backend: the reverse proxy terminating HTTPS is
    # the one public entry point. Published on 0.0.0.0, this served the app over plain HTTP to
    # anyone who found the host by IP.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
